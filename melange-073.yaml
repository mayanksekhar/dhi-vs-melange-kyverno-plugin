package:
  name: kyverno-plugin-melange-demo
  version: 0.7.3
  epoch: 0
  description: Kyverno plugin for Policy Reporter, built from kyverno/policy-reporter-plugins
  copyright:
    - license: Apache-2.0
environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-plugins
      tag: kyverno-plugin-v0.7.3
      expected-commit: 0a8a7bd523972c6b9573f388a9c99aa34c017f61
  - uses: go/build
    with:
      modroot: plugins/kyverno
      packages: .
      output: kyverno-plugin
      ldflags: -X main.Version=0.7.3
